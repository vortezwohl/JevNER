<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">JevNER icon</title>
  <desc id="desc">A TRON-style detection reticle locking onto three entity spans, one glowing brighter than the rest.</desc>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="11" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E7490"/>
      <stop offset="1" stop-color="#164E63"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" fill="#050A14"/>

  <!-- faint grid -->
  <g stroke="#0E2233" stroke-width="1">
    <path d="M0 64H256M0 128H256M0 192H256"/>
    <path d="M64 0V256M128 0V256M192 0V256"/>
  </g>

  <!-- detection reticle (NER brackets) -->
  <g fill="none" stroke="#00E5FF" stroke-width="7" stroke-linecap="square" filter="url(#glow)">
    <path d="M20 60V20H60"/>
    <path d="M196 20H236V60"/>
    <path d="M236 196V236H196"/>
    <path d="M60 236H20V196"/>
  </g>

  <!-- entity spans: two dim, the locked one glows -->
  <g stroke-linecap="square">
    <rect x="44" y="96" width="64" height="20" fill="none" stroke="url(#dim)" stroke-width="6"/>
    <rect x="148" y="96" width="64" height="20" fill="none" stroke="url(#dim)" stroke-width="6"/>
    <rect x="92" y="146" width="72" height="22" fill="#00E5FF" stroke="#7FF6FF" stroke-width="3" filter="url(#glow)"/>
  </g>

  <!-- scan line sweeping through the locked span -->
  <path d="M92 157H164" stroke="#B6FF00" stroke-width="4" stroke-linecap="square" filter="url(#glow)"/>
</svg>