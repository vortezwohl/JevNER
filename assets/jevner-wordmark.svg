<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-labelledby="title desc">
  <title id="title">JevNER wordmark</title>
  <desc id="desc">JevNER wordmark in a Rick-and-Morty style: the gooey blob icon on a transparent background beside chunky hand-drawn lettering with a black outline and acid-green fill.</desc>
  <defs>
    <linearGradient id="goo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8FF58"/>
      <stop offset="0.55" stop-color="#8CE838"/>
      <stop offset="1" stop-color="#5FC72E"/>
    </linearGradient>
    <linearGradient id="goo2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE3FF"/>
      <stop offset="1" stop-color="#35B5E0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8FF6E"/>
      <stop offset="1" stop-color="#79D926"/>
    </linearGradient>
  </defs>

  <!-- ==== gooey blob icon (irregular, transparent background) ==== -->
  <g transform="translate(4 44) scale(0.47)">
    <path d="M116 22
             C 152 18 176 34 196 52
             C 220 74 238 96 232 128
             C 227 155 236 168 222 190
             C 208 212 184 210 160 224
             C 134 239 108 232 84 220
             C 58 207 34 194 28 162
             C 22 132 16 106 34 82
             C 52 58 70 42 88 30
             C 96 24 106 23 116 22 Z"
          fill="url(#goo)" stroke="#10140A" stroke-width="14" stroke-linejoin="round"/>
    <path d="M74 66 C 96 48 128 42 158 52 C 176 58 188 68 192 82
             C 166 70 128 64 96 74 C 84 78 76 82 74 66 Z"
          fill="#D6FFA0" opacity="0.75"/>
    <g stroke="#10140A" stroke-width="10" stroke-linejoin="round">
      <path d="M60 96 l 26 -8 l 14 22 l -22 12 Z" fill="#2E7C1E"/>
      <path d="M168 88 l 26 2 l 6 26 l -24 6 l -10 -20 Z" fill="#2E7C1E"/>
      <path d="M92 138 l 40 -10 l 22 30 l -34 26 l -30 -18 Z" fill="url(#goo2)"/>
    </g>
    <g fill="none" stroke="#10140A" stroke-width="13" stroke-linecap="round">
      <path d="M72 128 C 68 112 74 104 86 100"/>
      <path d="M186 108 C 196 118 196 130 190 142"/>
      <path d="M104 204 C 118 210 134 208 146 200"/>
    </g>
    <path d="M98 150 C 116 144 136 146 150 152" fill="none" stroke="#10140A" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 17"/>
    <path d="M226 66 c 6 10 8 16 2 22 c -6 6 -14 4 -16 -4 c -2 -8 6 -12 14 -18 Z"
          fill="url(#goo)" stroke="#10140A" stroke-width="9" stroke-linejoin="round"/>
    <path d="M42 52 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z" fill="#10140A"/>
    <path d="M206 218 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" fill="#10140A"/>
  </g>

  <!-- ==== chunky lettering: JevNER with double outline ==== -->
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Arial Rounded MT Bold', Arial, sans-serif"
     font-weight="900" font-size="86" letter-spacing="1" text-anchor="start">
    <!-- black offset slab -->
    <text x="150" y="128" fill="#10140A" transform="rotate(-3 150 128)">JevNER</text>
    <!-- acid fill on top -->
    <text x="146" y="122" fill="url(#word)" transform="rotate(-3 146 122)">JevNER</text>
  </g>

  <!-- hand-drawn underline swoosh -->
  <path d="M150 146 C 190 156 250 148 306 140 C 348 134 372 138 386 144"
        fill="none" stroke="#10140A" stroke-width="9" stroke-linecap="round"/>

  <!-- entity chips riding the swoosh -->
  <g stroke="#10140A" stroke-width="6" stroke-linejoin="round">
    <path d="M170 158 l 22 -6 l 10 14 l -18 8 Z" fill="url(#goo2)"/>
    <path d="M232 152 l 24 -4 l 8 16 l -20 6 Z" fill="#2E7C1E"/>
    <path d="M296 148 l 26 -6 l 10 16 l -22 8 Z" fill="url(#goo2)"/>
  </g>

  <!-- flying droplet + sparkles -->
  <path d="M420 92 c 7 11 9 18 2 25 c -7 7 -16 4 -18 -5 c -2 -9 7 -13 16 -20 Z"
        fill="url(#goo)" stroke="#10140A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M452 40 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z" fill="#10140A"/>
  <path d="M402 168 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 Z" fill="#10140A"/>
</svg>