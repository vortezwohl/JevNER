[project]
name = "jevner"
version = "0.1.0"
description = "Zero-shot multilingual NER SDK on System One decision models: nested entity trees, customizable entity packs, 24-language coverage, bundled tokenizer, no local models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt4py>=0.0.6",
    "ruff>=0.17.3",
    "tokenizers>=0.23.3",
    "typesafe-sdk>=0.7.5",
    "vortezwohl>=0.1.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["prompt4py", "prompt4py.*", "vortezwohl", "vortezwohl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
